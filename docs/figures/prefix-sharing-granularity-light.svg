           font-variant-numeric: tabular-nums; text-anchor: middle; }
  .note { fill: #898781; font: 400 12px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .gl   { stroke: #e1e0d9; stroke-width: 1; }
  .ax   { stroke: #c3c2b7; stroke-width: 1; }
  .tk   { stroke: #898781; stroke-width: 1; }
  .gap  { fill: #fcfcfb; }
  .trk  { fill: #d6d5cd; }
  .a    { fill: #2a78d6; }
  .b    { fill: #eb6834; }
</style>
<rect class="bg" x="0" y="0" width="700" height="438"/>
<text class="t1" x="20" y="30">Where prefix sharing stops</text>
<text class="t2" x="20" y="53">Block-aligned sharing reuses whole blocks only, so it gives up the tail.</text>
<text class="t2" x="20" y="71">Radix sharing ends where the prefix does.</text>
