<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 438" width="700" height="438" role="img" aria-label="Block-aligned prefix sharing rounds down to the last whole 16-token block, sharing 192 of 200 tokens and 48 of 51. Radix sharing ends where the prefix does, sharing 200 of 200 and 51 of 51.">
<style>
