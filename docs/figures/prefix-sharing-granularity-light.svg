  .grp  { fill: #52514e;  font: 600 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           letter-spacing: .07em; text-transform: uppercase; }
  .val  { fill: #52514e;  font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           font-variant-numeric: tabular-nums; }
